facebook_url: "https://www.facebook.com/tortoiztheme"
twitter_url: "https://twitter.com/tortoizthemes"
instagram_url: "https://instagram.com/"

hero_image: "/assets/images/page_header_2.jpg"


sass:
  sass_dir: _sass
  style: compressed

site_preloader: true

collections:
  services:
    output: true
  pages:
    output: true
